name: CI Validate and Artifacts

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run tests and pipeline
        env:
          CI: 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install requests
          .venv/bin/python run_tests.py

      - name: Upload test_reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: test_reports/

      - name: Upload repair_prompts
        if: exists('repair_prompts')
        uses: actions/upload-artifact@v4
        with:
          name: repair-prompts
          path: repair_prompts/

      - name: Upload repair_suggestions
        if: exists('repair_suggestions')
        uses: actions/upload-artifact@v4
        with:
          name: repair-suggestions
          path: repair_suggestions/

      - name: Upload repair_history
        if: exists('repair_history.json')
        uses: actions/upload-artifact@v4
        with:
          name: repair-history
          path: repair_history.json

      - name: Create draft PR with suggestions
        if: steps.create_suggestions.outputs.suggestions_found == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: '[ai-builder] Apply repair suggestions'
          title: '[ai-builder] Repair suggestions'
          body: |-
            Automated repair suggestions were generated by the validation pipeline. Please review suggestions in `repair_suggestions/` and `repair_history.json`.
          branch: ai-builder/repair-suggestions-${{ github.run_id }}
          draft: true

  prepare-suggestions:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      suggestions_found: ${{ steps.suggest.outputs.found }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare suggestions flag
        id: suggest
        run: |
          if [ -d repair_suggestions ] && [ "$(ls -A repair_suggestions || true)" ]; then
            echo "found=true" > found.txt
            echo "::set-output name=found::true"
          else
            echo "found=false" > found.txt
            echo "::set-output name=found::false"
          fi
